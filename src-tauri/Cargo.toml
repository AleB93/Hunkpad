[package]
name = "diffpane"
version = "0.1.0"
description = "Lightweight Git diff viewer"
edition = "2021"

[lib]
name = "diffpane_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify-debouncer-mini = "0.5"

# "Copy for LLM" puts a file on the Windows clipboard (CF_HDROP), like Explorer's copy.
[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4"
