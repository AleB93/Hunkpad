name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a repository with …
        2. Click …
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Hunkpad version, OS version, and the output of `git --version`.
      placeholder: Hunkpad 0.1.0 · macOS 15.5 · git version 2.50.1
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Output log
      description: If a Git command failed, copy the relevant lines from the output log (⋯ → Toggle output log). Remove anything private.
      render: text
