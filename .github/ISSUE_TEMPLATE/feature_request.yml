name: Feature request
description: An idea for something Hunkpad could do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task or problem, rather than the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could Hunkpad help?
