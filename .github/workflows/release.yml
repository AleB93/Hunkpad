# Builds the installers on Windows, macOS (Apple Silicon and Intel) and Linux
# when a version tag is pushed, and attaches them to a draft GitHub release.
# Release: `npm version 0.2.0 && git push --follow-tags`, then review and
# publish the draft on GitHub (its notes come from docs/release-notes/).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Release notes for this tag
        id: notes
        shell: bash
        run: |
          file="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$file" ]; then echo "file=$file" >> "$GITHUB_OUTPUT"; fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Hunkpad ${{ github.ref_name }}
          releaseBody: See the notes below and CHANGELOG.md.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Use the release notes file as the release body
        if: steps.notes.outputs.file != '' && matrix.platform == 'ubuntu-22.04'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --notes-file "${{ steps.notes.outputs.file }}"
