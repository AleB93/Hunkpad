# Releases a new version whenever the version in package.json changes on
# master: builds the installers on Windows, macOS (Apple Silicon and Intel) and
# Linux, and publishes them as release v<version> once all four builds pass.
# The release text is docs/release-notes/v<version>.md (if it exists).
#
# To release: `npm version 0.3.0 --no-git-tag-version`, write the notes, commit, push.
name: Release

on:
  push:
    branches: [master]
    # The workflow file too, so a change to it releases a version not released yet.
    paths: [package.json, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Is this a version that has no release yet? Then create it as a draft.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Version without a release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          draft=$(gh release view "v$version" --json isDraft -q .isDraft 2>/dev/null || echo none)
          if [ "$draft" = "false" ]; then
            echo "v$version is already released: nothing to do."
            exit 0
          fi
          # A draft left by a failed run is replaced (re-run with "Run workflow").
          [ "$draft" = "true" ] && gh release delete "v$version" --yes
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create the draft release
        id: create
        if: steps.check.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          notes="docs/release-notes/v$VERSION.md"
          [ -f "$notes" ] || { echo "See CHANGELOG.md." > /tmp/notes.md; notes=/tmp/notes.md; }
          gh release create "v$VERSION" --draft --target "$GITHUB_SHA" \
            --title "Hunkpad v$VERSION" --notes-file "$notes"
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"v$VERSION\") | .id")
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.version != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          args: ${{ matrix.args }}

  # Only when every installer was built: make the release public.
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "v${{ needs.prepare.outputs.version }}" --repo "$GITHUB_REPOSITORY" --draft=false --latest
